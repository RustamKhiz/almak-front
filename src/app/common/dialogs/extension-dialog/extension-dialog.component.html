<app-draggable-dialog-title>{{ title() }}</app-draggable-dialog-title>
<mat-dialog-content>
  <form class="dialog-form" [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Цвет</mat-label>
      <input matInput formControlName="color" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Покрытие</mat-label>
      <mat-select formControlName="covering">
        @for (covering of coveringOptions(); track covering) {
          <mat-option [value]="covering">{{ covering }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="dialog-row">
      <mat-form-field appearance="outline">
        <mat-label>Ширина</mat-label>
        <input matInput type="number" formControlName="width" placeholder="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Высота</mat-label>
        <input matInput type="number" formControlName="height" placeholder="0" />
      </mat-form-field>
    </div>

    <app-quantity-field formControlName="setCount" label="Количество комплектов" [min]="0" [step]="1" />
    <app-quantity-field formControlName="quantityPerSet" label="Количество доборов" [min]="0" [step]="0.5" />

    <mat-form-field appearance="outline">
      <mat-label>Общая квадратура</mat-label>
      <input matInput type="number" formControlName="totalArea" step="0.01" placeholder="0" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Цена за квадратный метр</mat-label>
      <input matInput type="number" formControlName="price" placeholder="0" />
    </mat-form-field>

    <div class="total-preview">
      <span>Стоимость</span>
      <strong>{{ getDraftTotal() | number: '1.0-0' }} ₽</strong>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Комментарий</mat-label>
      <textarea matInput rows="3" formControlName="comment"></textarea>
    </mat-form-field>

    <app-catalog-autocomplete-field title="Поставщик" formControlName="supplier" [options]="supplierOptions()" />
  </form>
</mat-dialog-content>
<div mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancelClick()">Отмена</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="onSaveClick()">
    Сохранить
  </button>
</div>
