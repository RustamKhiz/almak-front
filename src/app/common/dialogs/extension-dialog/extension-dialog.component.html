<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <form class="dialog-form" [formGroup]="form">
    <mat-form-field appearance="outline"
      ><mat-label>Цвет</mat-label><input matInput formControlName="color"
    /></mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Покрытие</mat-label>
      <mat-select formControlName="covering">
        @for (covering of coveringOptions; track covering) {
          <mat-option [value]="covering">{{ coveringLabels[covering] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="dialog-row">
      <mat-form-field appearance="outline"
        ><mat-label>Ширина</mat-label><input matInput type="number" formControlName="width"
      /></mat-form-field>
      <mat-form-field appearance="outline"
        ><mat-label>Высота</mat-label><input matInput type="number" formControlName="height"
      /></mat-form-field>
    </div>
    <mat-form-field appearance="outline"
      ><mat-label>Цена</mat-label><input matInput type="number" formControlName="price"
    /></mat-form-field>
    <app-quantity-field formControlName="count" />
    <mat-form-field appearance="outline"
      ><mat-label>Комментарий</mat-label><textarea matInput rows="3" formControlName="comment"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<div mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancelClick()">Отмена</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="onSaveClick()">
    Сохранить
  </button>
</div>
