<h2 mat-dialog-title>{{ title() }}</h2>

<mat-dialog-content>
  <form class="dialog-form" [formGroup]="form">
    <div class="door-kind">
      <div class="door-kind__label">Тип входной двери</div>
      <mat-radio-group formControlName="kind">
        @for (kind of kindOptions; track kind) {
          <mat-radio-button [value]="kind">{{ kindLabels[kind] }}</mat-radio-button>
        }
      </mat-radio-group>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Модель</mat-label>
      <input matInput formControlName="model" />
    </mat-form-field>

    <div class="dialog-row dialog-row--sizes">
      <app-catalog-autocomplete-field
        title="Ширина (см)"
        mode="number"
        formControlName="width"
        [options]="widthOptions"
      />
      <app-catalog-autocomplete-field
        title="Высота (см)"
        mode="number"
        formControlName="height"
        [options]="heightOptions"
      />
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Цвет</mat-label>
      <input matInput formControlName="color" />
    </mat-form-field>

    @if (isWelded()) {
      <div class="dialog-row dialog-row--sizes">
        <app-catalog-autocomplete-field title="Покраска" formControlName="painting" [options]="paintingOptions" />
        <app-catalog-autocomplete-field
          title="Обшивка цвет"
          formControlName="panelColor"
          [options]="panelColorOptions"
        />
      </div>

      <mat-checkbox formControlName="hasPeephole">Глазок есть</mat-checkbox>
    }

    <mat-form-field appearance="outline">
      <mat-label>Цена</mat-label>
      <input matInput type="number" formControlName="price" />
    </mat-form-field>

    <app-quantity-field formControlName="count" />

    <mat-form-field appearance="outline">
      <mat-label>Комментарий</mat-label>
      <textarea matInput rows="3" formControlName="comment"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancelClick()">Отмена</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="onSaveClick()">
    Сохранить
  </button>
</div>
