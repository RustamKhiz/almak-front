<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancelClick()">{{ data.cancelText }}</button>
  <button mat-flat-button color="primary" type="button" (click)="onConfirmClick()">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
