<div class="page">
  <div class="page-header">
    <h1 class="page-title">Справочники</h1>
    <button mat-flat-button (click)="onAdd($event)">Добавить справочник</button>
  </div>

  <table mat-table [dataSource]="catalogs()" class="catalogs-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Название</th>
      <td mat-cell *matCellDef="let catalog">{{ catalog.name }}</td>
    </ng-container>

    <ng-container matColumnDef="key">
      <th mat-header-cell *matHeaderCellDef>Ключ</th>
      <td mat-cell *matCellDef="let catalog">{{ catalog.key ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="itemsCount">
      <th mat-header-cell *matHeaderCellDef>Элементов</th>
      <td mat-cell *matCellDef="let catalog">{{ catalog.itemsCount }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let catalog" class="actions-cell">
        <button mat-icon-button (click)="onRename($event, catalog)" title="Переименовать">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="onDelete($event, catalog)" title="Удалить">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let catalog; columns: displayedColumns" class="clickable-row" (click)="onRowClick(catalog)"></tr>
  </table>

  @if (catalogs().length === 0) {
    <p class="empty-state">Справочники не созданы. Добавьте первый.</p>
  }
</div>
