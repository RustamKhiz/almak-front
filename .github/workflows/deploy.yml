name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat << 'EOF' > ~/.ssh/known_hosts
          ${{ secrets.KNOWN_HOSTS }}
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Upload frontend build
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            dist/almak/browser/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/almak-frontend/

      - name: Build desktop app
        run: npm run electron:build:win

      - name: Prepare desktop download artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/downloads
          cp release/Almak-Setup-*.exe release/downloads/Almak-Setup-latest.exe
          cp release/Almak-Setup-*.exe release/downloads/
          cp release/Almak-Setup-*.exe.blockmap release/downloads/
          cp release/latest.yml release/downloads/

      - name: Upload desktop artifacts
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            release/downloads/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/almak-desktop/

      - name: Deploy frontend on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            sudo mkdir -p /var/www/app &&
            sudo mkdir -p /var/www/app/downloads &&
            sudo rsync -av --delete /tmp/almak-frontend/ /var/www/app/ &&
            sudo mkdir -p /var/www/app/downloads &&
            sudo rsync -av --delete /tmp/almak-desktop/ /var/www/app/downloads/ &&
            sudo chown -R www-data:www-data /var/www/app &&
            sudo find /var/www/app -type d -exec chmod 755 {} \; &&
            sudo find /var/www/app -type f -exec chmod 644 {} \; &&
            sudo systemctl reload nginx
          "
