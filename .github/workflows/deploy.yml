name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat << 'EOF' > ~/.ssh/known_hosts
          ${{ secrets.KNOWN_HOSTS }}
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Upload frontend build
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            dist/almak/browser/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/almak-frontend/
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/nginx/almakk.ru.*.conf \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

      - name: Deploy frontend on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            sudo mkdir -p /var/www/app &&
            sudo rsync -av --delete /tmp/almak-frontend/ /var/www/app/ &&
            sudo chown -R www-data:www-data /var/www/app &&
            sudo find /var/www/app -type d -exec chmod 755 {} \; &&
            sudo find /var/www/app -type f -exec chmod 644 {} \; &&
            if [ -f /etc/letsencrypt/live/almakk.ru/fullchain.pem ] && [ -f /etc/letsencrypt/live/almakk.ru/privkey.pem ]; then
              sudo cp /tmp/almakk.ru.ssl.conf /etc/nginx/sites-available/almakk.ru;
            else
              sudo cp /tmp/almakk.ru.http.conf /etc/nginx/sites-available/almakk.ru;
            fi &&
            sudo ln -sfn /etc/nginx/sites-available/almakk.ru /etc/nginx/sites-enabled/almakk.ru &&
            sudo nginx -t &&
            sudo systemctl reload nginx
          "
